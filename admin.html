<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Admin panel</h1><input id="aid" placeholder="Admin Telegram ID"><button onclick="load()">Kirish</button><section id="a"></section></main>
<script>
let aid='';const a=document.getElementById('a');
async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-id':aid,'Content-Type':'application/json'};return (await fetch(u,o)).json()}
async function load(){aid=document.getElementById('aid').value;const t=await api('/api/admin/tickets');a.innerHTML='<h2>Chiptalar</h2>'+t.map(x=>`<div class="card"><b>${x.code}</b> — ${x.full_name} — ${x.title} — ${x.status} ${x.status==='pending'?`<button onclick="ok('${x.code}')">Tasdiqlash</button>`:''}</div>`).join('')+
'<h2>Yangilik qo‘shish</h2><textarea id="nt"></textarea><button onclick="addNews()">Qo‘shish</button>'+
'<h2>Test qo‘shish</h2><input id="tt" placeholder="Test nomi"><input id="td" type="number" value="30" placeholder="Daqiqa"><textarea id="qq" placeholder=\'[{"text":"Savol","options":["A","B","C","D"]}]\'></textarea><button onclick="addTest()">Test yaratish</button>'}
async function ok(c){await api('/api/admin/ticket/'+c+'/approve',{method:'POST'});load()}
async function addNews(){await api('/api/admin/news',{method:'POST',body:JSON.stringify({text:document.getElementById('nt').value})});load()}
async function addTest(){let q=JSON.parse(document.getElementById('qq').value);await api('/api/admin/tests',{method:'POST',body:JSON.stringify({title:document.getElementById('tt').value,durationMin:+document.getElementById('td').value,questions:q})});load()}
</script></body></html>
